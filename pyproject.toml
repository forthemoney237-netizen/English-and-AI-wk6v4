[project]
name = "word-vector-lab"
version = "1.0.0"
description = "GloVe word-vector arithmetic on Vercel"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.0",
  "gensim==4.3.3",
  "numpy==1.26.4",
  "scipy==1.12.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python build_model.py"

